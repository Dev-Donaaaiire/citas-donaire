name: Krono Auto-Sync & Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar limpiamente con Upstream (Sin conflictos)
        run: |
          git config user.name "Krono Updater"
          git config user.email "bot@citas-donaire.dev"
          git remote add upstream https://github.com/Dev-Donaaaiire/citas-donaire.git || true
          git fetch upstream main
          git checkout -B main upstream/main
          git push origin main --force
