name: Krono Auto-Sync & Update

on:
  workflow_dispatch: # Permite ejecutar la actualización con 1 clic desde GitHub
  schedule:
    - cron: '0 4 * * 1' # Cada lunes a las 04:00 UTC

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar con Krono Upstream Oficial
        run: |
          git config user.name "Krono Updater"
          git config user.email "bot@citas-donaire.dev"
          git remote add upstream https://github.com/Dev-Donaaaiire/citas-donaire.git || true
          git fetch upstream main
          git checkout main
          git merge -X theirs upstream/main --allow-unrelated-histories -m "chore(krono): sincronización automática con upstream oficial" || {
            git checkout upstream/main -- .
            git add -A
            git commit -m "chore(krono): forzar actualización limpia con upstream" || true
          }
          git push origin main
